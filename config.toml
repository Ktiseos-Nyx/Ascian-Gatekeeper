# ============================================================================
# SERVER & CHANNEL CONFIGURATION
# ============================================================================

# List of server (guild) IDs allowed to use this bot
# Leave empty [] to allow ALL servers (public mode)
# Get server ID: Right-click server icon → Copy Server ID (need Developer Mode enabled)
ALLOWED_GUILD_IDS = []  # Example: [123456789, 987654321]

# List of channel IDs where the bot will automatically scan for images
# Leave empty [] to monitor ALL channels in allowed servers
# Get channel ID: Right-click channel → Copy Channel ID
MONITORED_CHANNEL_IDS = []

# ============================================================================
# FEATURE MANAGEMENT (Per-Server)
# ============================================================================
# Feature toggles are now managed per-server via guild_settings.json
# Administrators can use the /settings command in Discord to configure features
#
# Available features (configured via /settings command):
# - "metadata" (enables emoji reactions, /metadata, and context menu)
# - "describe" (enables the /describe command and button)
# - "ask" (enables the /ask command for conversational AI)
# - "techsupport" (enables the /techsupport command for IT help)
# - "coder" (enables the /coder command for programming help)
# - "fun_commands" (enables /decide, /poll, /wildcard commands)
# - "qotd" (enables Question of the Day feature)
# - "interact" (enables /interact command for user interactions)
#
# See guild_settings.json for current configuration
#
# NOTE: Old [channel_features] system has been deprecated in favor of guild_settings.json

# ============================================================================
# SECURITY SYSTEM - Anti-Scam Detection
# ============================================================================

# CATCHER role ID (self-assignable color role that scammers exploit)
# Get role ID: Right-click role → Copy Role ID (need Developer Mode enabled)
CATCHER_ROLE_ID = 

# Trusted user IDs who bypass all security checks (admins, mods, etc.)
# Get user ID: Right-click user → Copy User ID
TRUSTED_USER_IDS = []  # Example: [123456789, 987654321]

# Admin Channel IDs for security alerts (supports multiple channels/servers)
# Security events (NSFW attempts, rate limit hits, etc.) will be posted here
# Get channel ID: Right-click channel → Copy Channel ID
ADMIN_CHANNEL_IDS = []  # Example: [123456789, 987654321]

# ============================================================================
# LOGGING & DEBUGGING
# ============================================================================

# Set to "DEBUG" for more verbose logging
LOG_LEVEL = "INFO"
